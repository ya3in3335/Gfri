name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Resolve tag and version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a semantic version like v1.0.0"; exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
          VERSION="${TAG#v}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          if [ "$CODE" -lt 1 ]; then CODE=1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (versionName=$VERSION, versionCode=$CODE)"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Configure release signing
        id: signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            {
              echo "GA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "GA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "GA_KEY_ALIAS=$KEY_ALIAS"
              echo "GA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release signing: production keystore from GitHub Secrets."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are not configured. The release APK will be signed with a temporary DEBUG key. See docs/building.md."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease -PappVersionName=${{ steps.version.outputs.version }} -PappVersionCode=${{ steps.version.outputs.code }} --stacktrace

      - name: Verify and rename APK
        id: apk
        run: |
          NAME="Green-Accesse-${{ steps.version.outputs.tag }}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/Green-Accesse-release.apk "dist/$NAME"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Write release notes
        run: |
          {
            echo "## Green Accesse ${{ steps.version.outputs.tag }}"
            echo
            echo "NFC companion app for the Green Access Windows application."
            echo
            echo "- APK: \`${{ steps.apk.outputs.name }}\` (SHA-256 in the attached \`.sha256\` file)"
            echo "- Minimum Android version: 8.0 (API 26)"
            echo
            if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
              echo "> **Warning:** this APK is signed with a temporary debug key because the release signing secrets are not configured."
              echo "> It is suitable for testing only. Configure the secrets described in docs/building.md before distributing."
            fi
            echo
            echo "See README.md for installation and pairing instructions."
          } > dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Green Accesse ${{ steps.version.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            dist/${{ steps.apk.outputs.name }}
            dist/${{ steps.apk.outputs.name }}.sha256
          fail_on_unmatched_files: true
